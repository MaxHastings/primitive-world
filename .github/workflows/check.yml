name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Format
        run: cargo +1.93.1 fmt --check
      - name: Lint and compile all targets
        run: cargo +1.93.1 clippy --locked --all-targets -- -D warnings
      - name: CPU tests (GPU suite is a separate release gate)
        run: cargo +1.93.1 test --locked -- --skip simulation::tests::
      - name: Python tool tests
        run: python -m unittest discover -s tools -p "test_*.py"
