[package]
name = "primitive_world"
version = "0.9.0"
edition = "2024"
rust-version = "1.93"
description = "A local GPU artificial-life simulator designed to live on a Windows desktop"
repository = "https://github.com/MaxHastings/primitive-world"
keywords = ["artificial-life", "simulation", "wgpu", "evolution", "wallpaper"]
categories = ["science", "simulation", "visualization"]
publish = false

[dependencies]
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = "24"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
