[package]
name = "primitive_world"
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
description = "A local GPU artificial-life sandbox with evolving recurrent agents"
repository = "https://github.com/MaxHastings/primitive-world"
publish = false

[dependencies]
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "24"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
